# 展開動画の作り置き（中央競馬・週末と祝日開催）
# 毎日4回動いて、枠順が出たレースから順に動画を作る。作成済みで変化が無いレースは飛ばすので、平日はすぐ終わる
name: race-videos

on:
  schedule:
    - cron: '15 23 * * *'   # 日本時間 8:15（当日朝：馬場発表・オッズ反映で作り直し）
    - cron: '0 2 * * *'     # 日本時間 11:00
    - cron: '0 8 * * *'     # 日本時間 17:00
    - cron: '0 12 * * *'    # 日本時間 21:00
  workflow_dispatch:         # 手動でも動かせる（Actions の画面の「Run workflow」）

concurrency:
  group: race-videos
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 日本語フォント
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk

      - name: ライブラリ
        run: pip install -r requirements.txt boto3

      - name: 全成績のキャッシュを戻す
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: careers-${{ github.run_id }}
          restore-keys: careers-

      - name: 動画を作る
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
        run: python batch_videos.py

      - name: 全成績のキャッシュを保存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: careers-${{ github.run_id }}
