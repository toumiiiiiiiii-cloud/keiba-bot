name: 不利リストを作る（JRA発表の今日の出来事）

on:
  workflow_dispatch:          # 「Run workflow」ボタンで手動実行
  schedule:
    - cron: '0 22 * * 0-4'    # 月〜金 日本時間の朝7時に自動実行

permissions:
  contents: write             # 作ったデータをリポジトリに保存するため

concurrency:
  group: trouble-list
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 必要な部品を入れる
        run: pip install requests

      - name: JRAの「今日の出来事」から不利・競走中の疾病を集める
        run: python tools/trouble_list.py

      - name: できたデータを保存する
        run: |
          git config user.name "trouble-list-bot"
          git config user.email "trouble-list-bot@users.noreply.github.com"
          git add data/trouble.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "不利リストを更新 $(date +'%Y-%m-%d')"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && break
              sleep 5
            done
          fi
